<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiff — the fast computer-use agent</title>
  <meta name="description" content="Quiff is an open-source agent that uses your computer and browser for you — at the speed of a person who knows the shortcuts.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23ff6a3d'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html {
      scrollbar-width: thin;
      scrollbar-color: rgba(242, 242, 240, 0.25) #0b0b0c;
    }
    /* Custom sleek scrollbar for Chrome, Edge, Safari */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0b0b0c;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(242, 242, 240, 0.2);
      border-radius: 999px;
      border: 2px solid #0b0b0c;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #ff6a3d;
    }
    html, body {
      background: #0b0b0c;
      color: #f2f2f0;
      min-height: 100vh;
      min-height: 100svh;
      font-family: 'Bricolage Grotesque', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }
    a { color: #f2f2f0; text-decoration: none; }
    a:hover { color: #ff6a3d; }
    ::selection { background: #ff6a3d; color: #0b0b0c; }

    @keyframes qpulse {
      0% { box-shadow: 0 0 0 0 rgba(255, 106, 61, 0.55); }
      70% { box-shadow: 0 0 0 9px rgba(255, 106, 61, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 106, 61, 0); }
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ff6a3d;
      flex: none;
      display: inline-block;
      animation: qpulse 2s ease-out infinite;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-height: 52px;
      padding: 0 24px;
      border-radius: 12px;
      background: #ff6a3d;
      color: #0b0b0c;
      box-shadow: 0 8px 30px -8px rgba(255, 106, 61, 0.55);
      text-decoration: none;
      font-weight: 700;
      font-size: 16px;
      letter-spacing: -0.01em;
      white-space: nowrap;
      transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
    }
    .btn-primary:hover {
      background: #ff7f58;
      color: #0b0b0c;
      transform: translateY(-1px);
      box-shadow: 0 12px 35px -8px rgba(255, 106, 61, 0.65);
    }

    .btn-ghost {
      display: inline-flex;
      align-items: center;
      min-height: 52px;
      padding: 0 24px;
      border-radius: 12px;
      border: 1px solid rgba(242, 242, 240, 0.16);
      background: rgba(20, 14, 12, 0.7);
      color: #f2f2f0;
      text-decoration: none;
      font-weight: 600;
      font-size: 16px;
      letter-spacing: -0.01em;
      white-space: nowrap;
      transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
    }
    .btn-ghost:hover {
      border-color: rgba(242, 242, 240, 0.5);
      background: rgba(242, 242, 240, 0.05);
      color: #f2f2f0;
    }

    .header-email {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      text-decoration: none;
      color: #e4e4e0;
      transition: color 0.15s ease;
    }
    .header-email:hover {
      color: #ff6a3d;
    }

    .footer-email {
      color: #9a9a96;
      text-decoration: none;
      transition: color 0.15s ease;
    }
    .footer-email:hover {
      color: #f2f2f0;
    }
  </style>
</head>
<body>
  <div style="min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; background: #0b0b0c; color: #f2f2f0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; position: relative; overflow: hidden;">
    <!-- Grid pattern overlay -->
    <div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none; background-image: linear-gradient(rgba(242, 242, 240, 0.035) 1px, transparent 1px), linear-gradient(90deg, rgba(242, 242, 240, 0.035) 1px, transparent 1px); background-size: 56px 56px; mask-image: linear-gradient(180deg, #000 0%, transparent 75%); -webkit-mask-image: linear-gradient(180deg, #000 0%, transparent 75%);"></div>
    
    <!-- Ambient glow effects -->
    <div aria-hidden="true" style="position: absolute; right: -10%; top: 58%; width: 80%; height: 150px; pointer-events: none; background: linear-gradient(90deg, rgba(255, 80, 35, 0) 0%, rgba(200, 60, 25, 0.45) 40%, rgba(255, 90, 40, 0.95) 100%); border-radius: 50%; filter: blur(45px); transform: rotate(-20deg); transform-origin: right center;"></div>
    <div aria-hidden="true" style="position: absolute; right: -12%; top: -18%; width: 40%; height: 70%; pointer-events: none; background: radial-gradient(50% 50% at 70% 30%, rgba(200, 60, 25, 0.55) 0%, rgba(200, 60, 25, 0) 70%); filter: blur(70px);"></div>
    <div aria-hidden="true" style="position: absolute; left: -10%; bottom: -15%; width: 32%; height: 50%; pointer-events: none; background: radial-gradient(50% 50% at 30% 70%, rgba(255, 80, 35, 0.8) 0%, rgba(220, 60, 25, 0.3) 45%, rgba(220, 60, 25, 0) 75%); filter: blur(60px);"></div>

    <!-- Header -->
    <header style="position: relative; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; width: 100%; max-width: 1360px; margin: 0 auto; padding: clamp(20px, 4vw, 36px) clamp(20px, 4vw, 56px);">
      <div style="font-weight: 800; font-size: 24px; letter-spacing: -0.04em; line-height: 1;">quiff<span style="color: #ff6a3d;">.</span></div>
      <a class="header-email" href="mailto:hi@quiff.si">hi@quiff.si</a>
    </header>

    <!-- Main Hero -->
    <main style="position: relative; flex: 1; display: flex; flex-direction: column; justify-content: center; width: 100%; max-width: 1360px; margin: 0 auto; padding: clamp(40px, 8vw, 96px) clamp(20px, 4vw, 56px);">
      <div style="display: inline-flex; align-items: center; gap: 10px; align-self: flex-start; padding: 8px 16px 8px 12px; border: 1px solid rgba(242, 242, 240, 0.12); border-radius: 999px; line-height: 1.4; background: rgba(242, 242, 240, 0.05); font-family: 'JetBrains Mono', monospace; font-size: 12.5px; color: #e4e4e0; margin-bottom: clamp(28px, 5vw, 44px);">
        <span class="pulse-dot"></span>
        <span style="white-space: nowrap;">In development · Apache 2.0</span>
      </div>

      <h1 style="font-size: clamp(44px, 9.5vw, 124px); line-height: 1; letter-spacing: -0.035em; font-weight: 700; max-width: 12ch; text-wrap: balance;">Give AI agents hands that move <span style="color: #ff6a3d;">fast.</span></h1>

      <div style="display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 32px 48px; margin-top: clamp(24px, 3.5vw, 40px);">
        <p style="font-size: clamp(20px, 2.4vw, 28px); line-height: 1.35; color: #d6d6d2; max-width: 24ch; font-weight: 400; letter-spacing: -0.01em; text-wrap: pretty;">Ultrafast computer use for any AI agent.</p>
        <div style="display: flex; gap: 12px; flex-wrap: wrap;">
          <a class="btn-primary" href="mailto:hi@quiff.si?subject=Quiff%20early%20access">Get early access <span aria-hidden="true" style="font-size: 18px;">→</span></a>
          <a class="btn-ghost" href="mailto:hi@quiff.si">Say hi</a>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer style="position: relative; width: 100%; max-width: 1360px; margin: 0 auto; padding: 0 clamp(20px, 4vw, 56px);">
      <div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px; padding: 22px 0 clamp(22px, 4vw, 32px); border-top: 1px solid rgba(242, 242, 240, 0.1); font-family: 'JetBrains Mono', monospace; font-size: 12.5px; color: #9a9a96;">
        <span style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 15px; color: #c4c4bf;">© 2026 Quiff</span>
        <a class="footer-email" href="mailto:hi@quiff.si">hi@quiff.si</a>
      </div>
    </footer>
  </div>
</body>
</html>
